name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: taiki-e/install-action@v2
        if: runner.os != 'Windows'
        with:
          tool: cargo-bundle@0.12.0

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --profile dist
          cp target/dist/rau.exe rau.exe
          mkdir dist
          7z a "dist/rau-${GITHUB_REF_NAME}-windows-x86_64.zip" rau.exe

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo bundle --profile dist --format osx \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir dist
          ditto -c -k --keepParent target/universal/dist/bundle/osx/Rau.app "dist/rau-${GITHUB_REF_NAME}-macos-universal.zip"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo bundle --profile dist --format appimage
          mkdir dist
          cp target/dist/bundle/appimage/*.AppImage "dist/rau-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: rau-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
