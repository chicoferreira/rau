name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Secrets are not available to workflows triggered from forked PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable) and wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-opt
        uses: sigoden/install-binary@v1
        with:
          repo: WebAssembly/binaryen
          tag: version_132
          name: wasm-opt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build web target
        run: ./web/build-web.sh

      - name: Assemble site
        run: |
          cp -R web dist
          rm dist/build-web.sh
          cp -R assets dist/assets

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          command: pages deploy dist --project-name rau
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
