[package]
name = "rau"
version = "0.1.0"
edition = "2024"
description = "Graphics engine focused on real-time rendering and user authoring"
repository = "https://github.com/chicoferreira/rau"
license-file = "LICENSE.md"

[package.metadata.bundle.bin.rau-bin]
name = "Rau"
identifier = "io.github.chicoferreira.rau"
icon = ["assets/rau-app-icon.svg"]
category = "Developer Tool"
short_description = "Graphics engine focused on real-time rendering and user authoring"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# use a different name here to avoid duplicate name
# see https://github.com/rust-lang/cargo/issues/6313
name = "rau-bin"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
bitflags = "2.11.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "from"] }
eframe = "0.36.1"
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui_dnd = "0.17.0"
egui_extras = { version = "0.36.1", features = ["syntect", "http", "image"] }
# TODO: go back to a crates.io version once this releases for egui 0.36
egui_ltreeview = { git = "https://github.com/LennysLounge/egui_ltreeview", rev = "59b32c9645" }
egui_table = "0.10.0"
egui_tiles = "0.17.1"
enumset = "1.1.10"
enum_dispatch = "0.3.13"
env_logger = "0.11.8"
fastrand = "2.3.0"
futures-lite = "2.6.0"
glam = { version = "0.33.0", features = ["serde"] }
half = "2.7.1"
heck = "0.5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
instant = "0.1"
log = "0.4.29"
naga = { version = "30.0.0", features = ["wgsl-in", "glsl-in"] }
# Not used directly: `egui`, `eframe` and `wgpu` instrument themselves through the
# `profiling` abstraction, and enabling this feature here routes all of their scopes
# into the same `puffin::GlobalProfiler` singleton `puffin_egui` reads.
profiling = { version = "1.0", features = ["profile-with-puffin"] }
puffin = "0.20"
# TODO: go back to a crates.io version once puffin releases for egui 0.36
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "911e9efbfa" }
serde_json = "1.0.149"
slotmap = { version = "1.0", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tobj = { version = "4.0.3", default-features = false, features = ["futures"] }
tokio = { version = "1.52.3", features = ["sync"] }
wgpu = { version = "30.0", features = ["naga-ir", "serde"] }
wgpu-profiler = { version = "0.28.0", features = ["puffin"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
itertools = "0.15.0"
url = "2.5.8"
rfd = "0.17.2"
serde = "1.0.228"
ehttp = { version = "0.7.1", features = ["json", "native-async"] }
# TODO: go back to a crates.io version once this releases for egui 0.36
egui-notify = { git = "https://github.com/UnknownSuperficialNight/egui-notify.git", rev = "ae98ed7cb5" }
# TODO: go back to a crates.io version once this releases for egui 0.36
egui-phosphor = { git = "https://github.com/UnknownSuperficialNight/egui-phosphor.git", rev = "d392183fe3" }
egui_commonmark = { version = "0.25.0", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
json-pretty-compact = "0.1.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
pollster = "1.0.1"
notify = "8.2.0"
toml = "1.1"
dirs = "6.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
serde_urlencoded = "0.7.1"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "Url",
    "Window",
]}
indexed_db_futures = { version = "0.6.4", features = ["typed-arrays"] }
instant = { version = "0.1", features = [ "wasm-bindgen" ] }
puffin = { version = "0.20", features = ["web"] }

[build-dependencies]
built = { version = "0.8.1", features = ["chrono", "git2"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[patch.crates-io]
# Keeps `wgpu-profiler` on the same `puffin` as `puffin_egui`.
# TODO: go back to a crates.io version once puffin releases for egui 0.36
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "911e9efbfa" }

# TODO: go back to a crates.io version once the fix is released upstream
eframe = { git = "https://github.com/chicoferreira/egui", rev = "eadb02bead" }
egui = { git = "https://github.com/chicoferreira/egui", rev = "eadb02bead" }
egui-wgpu = { git = "https://github.com/chicoferreira/egui", rev = "eadb02bead" }
egui_extras = { git = "https://github.com/chicoferreira/egui", rev = "eadb02bead" }
